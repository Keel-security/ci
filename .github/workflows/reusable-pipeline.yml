# Convenience: build + single-region deploy.
# For US+EU use reusable-build + reusable-deploy twice (see examples/keel-lambda-host).
name: reusable-pipeline

on:
  workflow_call:
    inputs:
      app_dir:
        type: string
        required: false
        default: "."
      node_version:
        type: string
        required: false
        default: "22"
      build_command:
        type: string
        required: false
        default: ""
      deploy_tool:
        type: string
        required: false
        default: "sst"
      deploy_command:
        type: string
        required: false
        default: ""
      sst_stage:
        type: string
        required: false
        default: "dev"
      sst_path:
        type: string
        required: false
        default: "."
      aws_region:
        type: string
        required: false
        default: "us-east-1"
      keel_env:
        description: SSM /keel/<keel_env>/… (default matches github_environment)
        type: string
        required: false
        default: "dev"
      github_environment:
        type: string
        required: false
        default: "dev"
      run_deploy:
        type: string
        required: false
        default: ""
      sam_stack_name:
        type: string
        required: false
        default: "keel-dev"
    secrets:
      AWS_ROLE_ARN:
        required: false
      DATABASE_URL:
        required: false
      KEEL_API_KEY:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      app_dir: ${{ inputs.app_dir }}
      node_version: ${{ inputs.node_version }}
      build_command: ${{ inputs.build_command }}

  deploy:
    name: "dev:deploy"
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      app_dir: ${{ inputs.app_dir }}
      node_version: ${{ inputs.node_version }}
      deploy_tool: ${{ inputs.deploy_tool }}
      deploy_command: ${{ inputs.deploy_command }}
      sst_stage: ${{ inputs.sst_stage }}
      sst_path: ${{ inputs.sst_path }}
      aws_region: ${{ inputs.aws_region }}
      keel_env: ${{ inputs.keel_env }}
      github_environment: ${{ inputs.github_environment }}
      sam_stack_name: ${{ inputs.sam_stack_name }}
      run_deploy: ${{ inputs.run_deploy }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KEEL_API_KEY: ${{ secrets.KEEL_API_KEY }}
