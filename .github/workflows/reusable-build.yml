# Shared build only — children then call reusable-deploy per region.
name: reusable-build

on:
  workflow_call:
    inputs:
      app_dir:
        type: string
        required: false
        default: "."
      node_version:
        type: string
        required: false
        default: "22"
      build_command:
        type: string
        required: false
        default: ""
    secrets:
      GH_READ_TOKEN:
        description: PAT to clone private github: deps (e.g. keel-lambda-common)
        required: false

permissions:
  contents: read

# For private github:Keel-security/keel-lambda-common deps, set repo secret
# GH_READ_TOKEN (PAT with contents:read on that repo). Default GITHUB_TOKEN
# cannot clone other private repos.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Keel CI templates
        uses: actions/checkout@v4
        with:
          repository: Keel-security/ci
          ref: main
          path: .keel-ci

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Allow npm to fetch private GitHub deps
        run: |
          TOKEN="${GH_READ_TOKEN:-$GITHUB_TOKEN}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
        continue-on-error: true

      - name: Build
        env:
          APP_DIR: ${{ inputs.app_dir }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          NODE_VERSION: ${{ inputs.node_version }}
        run: bash .keel-ci/scripts/build.sh
